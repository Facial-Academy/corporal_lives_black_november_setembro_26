}

main{position:relative;width:100%;max-width:560px;text-align:center}

.lockup{width:min(330px,86vw);height:auto;display:block;margin:0 auto 28px}

h1{
  font-size:clamp(42px,11.5vw,92px);line-height:1;letter-spacing:-.015em;font-weight:700;
  margin:0 0 16px;
}
.sub span{display:block;text-wrap:balance}
.sub{
  font-size:clamp(16px,4.3vw,20px);line-height:1.5;color:var(--txt-mut);
  margin:0 auto;max-width:34ch;
}

/* entrada suave, sem mexer no layout */
.lockup,h1,.sub span{display:block;text-wrap:balance}
.sub{animation:surge .7s cubic-bezier(.2,.8,.2,1) both}
h1{animation-delay:.1s}
.sub span{display:block;text-wrap:balance}
.sub{animation-delay:.2s}
@keyframes surge{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* telas baixas */
@media (max-height:740px){
  body{padding:16px 18px}
  .lockup{width:min(248px,68vw);margin-bottom:18px}
  h1{font-size:clamp(36px,10vw,56px);margin-bottom:12px}
  .sub span{display:block;text-wrap:balance}
.sub{font-size:15px;line-height:1.45}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
